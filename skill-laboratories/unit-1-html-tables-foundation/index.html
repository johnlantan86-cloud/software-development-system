<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HTML Tables Foundation</title>
</head>
<body>
  <header>
    <h1>Learning Progress Table</h1>
    <p>This page practices showing information in rows and columns.</p>
  </header>

  <main>
    <section>
      <h2>Skill Progress</h2>

      <table>
        <thead>
          <tr>
            <th>Skill</th>
            <th>Status</th>
            <th>Evidence</th>
          </tr>
        </thead>

        <tbody>
          <tr>
            <td>HTML Structure</td>
            <td>Passed</td>
            <td>Created valid HTML pages</td>
          </tr>

          <tr>
            <td>Links</td>
            <td>Passed</td>
            <td>Built navigation links</td>
          </tr>

          <tr>
            <td>Forms</td>
            <td>Passed</td>
            <td>Created a contact form</td>
          </tr>
        </tbody>
      </table>
    </section>
  </main>
</body>
</html>
