<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Display Flow Foundation</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>CSS Display and Basic Layout Flow</h1>

  <section>
    <h2>Block Elements</h2>
    <div class="block-box">Block One</div>
    <div class="block-box">Block Two</div>
  </section>

  <section>
    <h2>Inline Elements</h2>
    <span class="inline-box">Inline One</span>
    <span class="inline-box">Inline Two</span>
  </section>

  <section>
    <h2>Inline-Block Elements</h2>
    <div class="inline-block-box">Box One </div>
    <div class="inline-block-box">Box Two</div>
  </section>
</body>
</html>
