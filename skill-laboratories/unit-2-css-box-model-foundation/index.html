<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Box Model Foundation</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>CSS Box Model Foundation</h1>
    <p>This page practices content, padding, border, and margin.</p>
  </header>

  <main>
    <section class="box">
      <h2>Box Model Example</h2>
      <p>This content sits inside the CSS box.</p>
    </section>

    <section class="box">
      <h2>Second Box</h2>
      <p>The margin creates space between this box and the first one.</p>
    </section>
  </main>
</body>
</html>
