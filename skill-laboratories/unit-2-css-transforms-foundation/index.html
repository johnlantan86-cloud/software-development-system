<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Transforms Foundation</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>CSS Transforms Foundation</h1>

  <section>
    <h2>Translate</h2>
    <div class="box translate-box">Move Me</div>
  </section>

  <section>
    <h2>Scale</h2>
    <div class="box scale-box">Scale Me</div>
  </section>

  <section>
    <h2>Rotate</h2>
    <div class="box rotate-box">Rotate Me</div>
  </section>
</body>
</html>
