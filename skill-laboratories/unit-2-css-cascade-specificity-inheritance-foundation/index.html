<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Cascade Specificity and Inheritance</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>CSS Cascade, Specificity, and Inheritance</h1>

  <section class="parent-section">
    <h2>Inheritance Example</h2>
    <p>This paragraph should inherit its text color from the parent section.</p>
  </section>

  <section>
    <h2>Specificity Example</h2>
    <p id="message" class="note">Which color will win?</p>
  </section>

  <section>
    <h2>Source Order Example</h2>
    <p class="order-example">Which background color will win?</p>
  </section>
</body>
</html>
