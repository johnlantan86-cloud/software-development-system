<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Units Foundation</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>CSS Units Foundation</h1>
    <p>This page compares different CSS units.</p>
  </header>

  <main>
    <section class="parent-box">
      <div class="percent-box">
        <p>50% width</p>
      </div>
    </section>

    <section class="viewport-box">
      <p>50vw width and 20vh height</p>
    </section>

    <section>
      <p class="rem-text">This text uses 2rem.</p>
    </section>
  </main>
</body>
</html>
