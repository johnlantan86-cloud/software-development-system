<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Pseudo-classes and Transitions</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>CSS Pseudo-classes and Transitions</h1>

  <section>
    <h2>Hover Example</h2>
    <button class="hover-button">Hover over me</button>
  </section>

  <section>
    <h2>Focus Example</h2>
    <label for="name">Name</label>
    <input id="name" class="focus-input" type="text">
  </section>
</body>
</html>
