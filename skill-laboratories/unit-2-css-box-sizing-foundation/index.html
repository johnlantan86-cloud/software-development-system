<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Box Sizing Foundation</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>CSS Box Sizing Foundation</h1>

  <section class="content-box">
    <h2>Content Box</h2>
    <p>This box uses the default content-box behavior.</p>

  <section class="border-box">
    <h2>Border Box</h2>
    <p>This box uses box-sizing: border-box.</p>
  </section>
</body>
</html>
